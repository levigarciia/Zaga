[workspace]
resolver = "3"
members = ["crates/nucleo", "crates/motor", "crates/interface"]
default-members = ["crates/interface"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
zaga_nucleo = { path = "crates/nucleo" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
